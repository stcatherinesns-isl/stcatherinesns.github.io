<body>
<div class="shell">
  <header class="topbar no-print">
    <div class="brand"><div class="brand-mark">ISL</div><div><div class="brand-title">ISL MANAGEMENT HUB</div><div class="brand-sub">Leadership • Evidence • Improvement</div></div></div>
    <nav class="nav" id="mainNav">
      <button class="active" data-view="dashboard" onclick="showView('dashboard')">Dashboard</button>
      <button data-view="login" id="navLogin" onclick="showView('login')">Member sign-in</button>
      <button data-view="workspace" id="navWorkspace" style="display:none" onclick="showView('workspace')">My workspace</button>
      <button data-view="admin" id="navAdmin" style="display:none" onclick="showView('admin')">Admin</button>
      <span class="user-chip" id="userChip">Shared dashboard</span>
      <button id="navLogout" style="display:none" onclick="logout()">Sign out</button>
    </nav>
  </header>
  <main class="container">
    <section id="dashboardView"><div class="card" style="margin-top:24px"><strong>Loading ISL dashboard…</strong><p class="sub">Connecting to the shared school leadership records.</p></div></section>
    <section id="loginView" style="display:none"></section>
    <section id="workspaceView" style="display:none"></section>
    <section id="adminView" style="display:none"></section>
    <section id="printArea" style="display:none"></section>
  </main>
</div>
<div class="modal-backdrop no-print" id="modalBackdrop" onclick="if(event.target===this)closeModal()"><div class="modal" id="modalContent"></div></div>
<div class="toast no-print" id="toast"></div>
<script>
function storageGet(key){try{return window.sessionStorage.getItem(key)||''}catch(e){return window.__islMemoryToken||''}}
function storageSet(key,value){try{window.sessionStorage.setItem(key,value)}catch(e){window.__islMemoryToken=value}}
function storageRemove(key){try{window.sessionStorage.removeItem(key)}catch(e){}window.__islMemoryToken=''}
const app = {token:storageGet('isl_token'),member:null,isAdmin:false,viewRoleKey:null,workspace:null,adminData:null,dashboard:null,monthKey:localMonth(),wsTab:'overview',expandedDomain:'D1',expandedStandard:'',report:null,reportYear:null,reportTerm:'Term 1'};
const roleKeys=[['PRINCIPAL','Principal'],['DEPUTY','Deputy Principal'],['AP2_1','Assistant Principal 2 — AP2 1'],['AP2_2','Assistant Principal 2 — AP2 2'],['AP2_3','Assistant Principal 2 — AP2 3']];
function localMonth(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function todayKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtDate(v){if(!v)return '';const d=new Date(String(v).slice(0,10)+'T12:00:00');return isNaN(d)?v:d.toLocaleDateString('en-IE',{day:'numeric',month:'short',year:'numeric'})}
function monthName(k){const [y,m]=k.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('en-IE',{month:'long',year:'numeric'})}
// URL of the separate ContentService API deployment. Paste the backend /exec URL here.
const API_URL = 'https://script.google.com/macros/s/AKfycbwSWYOYT7XI3j1lbQ9mJfD0UOYfWtV2fAZ_fbOFnM3EfvtbqbTTcrkORL--YxUuBv8/exec';
function randomRequestId(){
  const bytes=new Uint8Array(16);
  if(window.crypto&&window.crypto.getRandomValues)window.crypto.getRandomValues(bytes);
  else for(let i=0;i<bytes.length;i++)bytes[i]=Math.floor(Math.random()*256);
  return Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('');
}
function waitMs(ms){return new Promise(resolve=>setTimeout(resolve,ms))}
function jsonpPoll(requestId,index){
  return new Promise((resolve,reject)=>{
    const callbackName='__islJsonp_'+requestId+'_'+index;
    const script=document.createElement('script');
    let settled=false;
    const timer=setTimeout(()=>finish(new Error('The ISL data service did not respond to a result check.')),12000);
    function finish(error,data){
      if(settled)return;settled=true;clearTimeout(timer);
      try{delete window[callbackName]}catch(e){window[callbackName]=undefined}
      if(script.parentNode)script.parentNode.removeChild(script);
      if(error)reject(error);else resolve(data);
    }
    window[callbackName]=data=>finish(null,data);
    script.onerror=()=>finish(new Error('Could not contact the ISL data service. Check that its web app deployment is active.'));
    script.src=API_URL+'?mode=poll&rid='+requestId+'&i='+index+'&cb='+callbackName+'&_='+Date.now();
    document.head.appendChild(script);
  });
}
async function pollApiResult(requestId){
  const started=Date.now();
  let first=null;
  while(Date.now()-started<90000){
    first=await jsonpPoll(requestId,0);
    if(first&&first.ready)break;
    await waitMs(450);
  }
  if(!first||!first.ready)throw new Error('The ISL data service timed out. Please try again.');
  const parts=[first.chunk];
  for(let i=1;i<first.count;i++){
    let part=await jsonpPoll(requestId,i);
    let attempts=0;
    while((!part||!part.ready)&&attempts<20){await waitMs(300);part=await jsonpPoll(requestId,i);attempts++;}
    if(!part||!part.ready)throw new Error('The data response was incomplete. Please try again.');
    parts.push(part.chunk);
  }
  const envelope=JSON.parse(parts.join(''));
  if(!envelope.ok)throw new Error(envelope.error||'The data service returned an error.');
  return envelope.data;
}
function api(fn,...args){
  return new Promise((resolve,reject)=>{
    try{
      if(!API_URL||API_URL.indexOf('PASTE_BACKEND_')!==-1)throw new Error('The app administrator must add the backend API URL to Index.html before using the app.');
      if(!/^https:\/\/script\.google\.com\/.+\/exec(?:\?.*)?$/.test(API_URL))throw new Error('The backend API URL in Index.html is not a valid Apps Script /exec URL.');
      const requestId=randomRequestId();
      const frameName='islApiFrame_'+requestId;
      const frame=document.createElement('iframe');frame.name=frameName;frame.id=frameName;frame.style.display='none';frame.setAttribute('aria-hidden','true');
      const form=document.createElement('form');form.method='POST';form.action=API_URL;form.target=frameName;form.style.display='none';form.acceptCharset='UTF-8';
      const fields={rid:requestId,payload:JSON.stringify({fn:fn,args:args})};
      Object.keys(fields).forEach(key=>{const input=document.createElement('input');input.type='hidden';input.name=key;input.value=fields[key];form.appendChild(input)});
      document.body.appendChild(frame);document.body.appendChild(form);
      form.submit();form.remove();
      pollApiResult(requestId).then(resolve,reject).finally(()=>{setTimeout(()=>{if(frame.parentNode)frame.parentNode.removeChild(frame)},1000)});
    }catch(error){reject(error)}
  });
}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),3000)}
function showView(view){['dashboard','login','workspace','admin'].forEach(v=>document.getElementById(v+'View').style.display=v===view?'block':'none');document.querySelectorAll('#mainNav button[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));if(view==='dashboard')loadDashboard();if(view==='login')renderLogin();if(view==='workspace'){if(!app.token){showView('login');return}loadWorkspace(app.viewRoleKey)}if(view==='admin'){if(!app.isAdmin){toast('Administrator access required.');showView('dashboard');return}loadAdmin()} }
function setNav(){document.getElementById('navLogin').style.display=app.token?'none':'inline-flex';document.getElementById('navWorkspace').style.display=app.token?'inline-flex':'none';document.getElementById('navAdmin').style.display=app.isAdmin?'inline-flex':'none';document.getElementById('navLogout').style.display=app.token?'inline-flex':'none';document.getElementById('userChip').textContent=app.member?app.member.name+' • '+app.member.initials:'Shared dashboard'}
async function start(){setNav();await loadDashboard();if(app.token){try{const data=await api('apiGetWorkspace',app.token);app.member=data.member;app.isAdmin=data.isAdmin;app.viewRoleKey=data.member.roleKey;setNav();app.workspace=data;}catch(e){storageRemove('isl_token');app.token='';app.member=null;app.isAdmin=false;setNav();}}}
async function loadDashboard(){try{app.dashboard=await api('apiGetDashboard',app.monthKey);renderDashboard()}catch(e){document.getElementById('dashboardView').innerHTML='<div class="notice warning">Could not load dashboard: '+esc(e.message)+'</div>'}}
function renderDashboard(){const d=app.dashboard;if(!d)return;const total=d.totalActions;const max=Math.max(1,...d.bars.map(x=>x.count));const activeMembers=d.members||[];let html=`<div class="page-head"><div><div class="eyebrow">Shared ISL overview</div><h1>Leadership &amp; Management Dashboard</h1><p class="sub">A shared view of recorded activity, upcoming school leadership dates and termly reflection progress. Activity counts are evidence of recorded work, not ratings of individual performance.</p></div><div class="pill-row"><button class="btn primary" onclick="showView('login')">Member sign-in</button></div></div>
  <div class="grid stats">
    <div class="card"><div class="stat-icon">↗</div><div class="stat-label">Actions recorded</div><div class="stat-value">${total}</div><div class="stat-note">Across all 16 LAOS standards</div></div>
    <div class="card"><div class="stat-icon">◎</div><div class="stat-label">Active duties</div><div class="stat-value">${d.totalDuties}</div><div class="stat-note">Currently assigned responsibilities</div></div>
    <div class="card"><div class="stat-icon">▦</div><div class="stat-label">ISL workspaces</div><div class="stat-value">${activeMembers.length}</div><div class="stat-note">Principal, Deputy Principal and AP2s</div></div>
    <div class="card"><div class="stat-icon">✓</div><div class="stat-label">Current term check-ins</div><div class="stat-value">${currentCheckinCount(d)}</div><div class="stat-note">Submitted by members for the current school year</div></div>
  </div>
  <div class="section-title"><h2>LAOS standards — recorded activity</h2><span class="badge">${total} actions logged</span></div>
  <div class="card"><div class="bar-list">${d.bars.map(x=>`<div class="bar-row"><div class="bar-label"><strong>${esc(x.id)}</strong> · ${esc(x.standard)}</div><div class="bar-track"><div class="bar-fill" style="width:${x.count/max*100}%"></div></div><div class="bar-count">${x.count}</div></div>`).join('')}</div><p class="cal-under">The count reflects entries in the action log. A low count is a prompt for discussion and reflection, not evidence that a responsibility is not being carried out.</p></div>
  <div class="grid two" style="margin-top:18px">
    <div class="card"><div class="calendar-top"><div><div class="eyebrow">All members</div><div class="month-label">${monthName(app.monthKey)}</div></div><div class="pill-row"><button class="btn ghost small" onclick="changeMonth(-1)">←</button><button class="btn ghost small" onclick="goThisMonth()">Today</button><button class="btn ghost small" onclick="changeMonth(1)">→</button></div></div><div id="dashboardCalendar"></div><div class="cal-under">Events entered by individual members appear here automatically. Termly check-in windows appear in December, March and June.</div></div>
    <div class="card"><div class="section-title" style="margin:0 0 12px"><h2>Upcoming ISL dates</h2><span class="badge">Shared</span></div><div class="event-list">${renderEventList(d.events.filter(e=>!e.completed&&(e.endDate||e.startDate)>=todayKey()).sort((a,b)=>a.startDate.localeCompare(b.startDate)).slice(0,8),false)||'<div class="empty"><strong>No upcoming dates yet</strong>Members can add dates from their own workspace calendar.</div>'}</div><div class="section-title"><h2>Termly check-ins</h2></div>${d.checkinSummary.map(c=>`<div style="margin:10px 0"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px"><strong>${c.term}</strong><span class="subtle">${c.completed} / ${c.total} submitted</span></div><div class="progress"><span style="width:${c.completed/c.total*100}%"></span></div></div>`).join('')}</div>
  </div>
  <div class="grid two" style="margin-top:18px"><div class="card"><h2>ISL team</h2><div class="member-list">${activeMembers.map(m=>`<div class="member-line"><div class="avatar">${esc(m.initials||'ISL')}</div><div class="member-meta"><div class="member-name">${esc(m.name||m.roleTitle)}</div><div class="member-role">${esc(m.roleTitle)} ${m.slotLabel?'· '+esc(m.slotLabel):''}</div></div><span class="badge gray">Workspace</span></div>`).join('')}</div></div><div class="card"><h2>Published termly reports</h2><p class="sub" style="font-size:12px;margin-bottom:12px">A team report and individual summaries become available here once all five members submit the relevant check-in.</p><div class="form-grid"><div class="field"><label>Term</label><select id="reportTerm"><option>Term 1</option><option>Term 2</option><option>Term 3</option></select></div><div class="field"><label>School year</label><input id="reportYear" value="${esc(d.currentSchoolYear||'')}"></div></div><button class="btn secondary" onclick="checkReport()">View available report</button><div id="reportStatus" class="cal-under"></div><div id="reportButtons"></div></div></div>
  <div id="dashboardReport"></div><div class="footer-note">ISL Management Hub · Looking at Our School 2022 · Leadership and Management</div>`;
  document.getElementById('dashboardView').innerHTML=html;
  renderCalendar('dashboardCalendar',app.monthKey,d.events,false);
}
function currentCheckinCount(d){const m=new Date().getMonth();const term=m===11?'Term 1':(m===2?'Term 2':(m===5?'Term 3':null));if(!term)return '—';const x=d.checkinSummary.find(a=>a.term===term);return x?x.completed:'0'}
function changeMonth(n){let [y,m]=app.monthKey.split('-').map(Number);m+=n;const d=new Date(y,m-1,1);app.monthKey=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');loadDashboard()}
function goThisMonth(){app.monthKey=localMonth();loadDashboard()}
function renderCalendar(targetId,monthKey,events,editable){const el=document.getElementById(targetId);if(!el)return;const [y,m]=monthKey.split('-').map(Number);const first=new Date(y,m-1,1),last=new Date(y,m,0);const start=new Date(y,m-1,1-first.getDay());const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];let html='<div class="calendar-grid">'+days.map(x=>`<div class="cal-weekday">${x}</div>`).join('');for(let i=0;i<42;i++){const day=new Date(start);day.setDate(start.getDate()+i);const key=day.getFullYear()+'-'+String(day.getMonth()+1).padStart(2,'0')+'-'+String(day.getDate()).padStart(2,'0');const inMonth=day.getMonth()===m-1;const todays=key===todayKey();const dayEvents=events.filter(e=>e.system?key===e.startDate:(key>=e.startDate&&key<=(e.endDate||e.startDate)));html+=`<div class="cal-day ${inMonth?'':'muted'} ${todays?'today':''}"><div class="cal-day-num">${day.getDate()}</div>${dayEvents.slice(0,3).map(e=>`<button class="cal-chip ${e.system?'system':''} ${e.completed?'done':''}" title="${esc(e.title)}" ${editable&&!e.system?`onclick="openEventModal('${esc(e.id)}')"`:`onclick="showCalendarEvent('${esc(e.id)}')"`}>${esc(e.title)}</button>`).join('')}${dayEvents.length>3?`<div style="font-size:8px;color:#657a75">+${dayEvents.length-3} more</div>`:''}${editable?`<button class="cal-add" onclick="openEventModal(null,'${key}')">+ add</button>`:''}</div>`;}html+='</div>';el.innerHTML=html;}
function showCalendarEvent(id){const e=(app.dashboard&&app.dashboard.events||[]).find(x=>x.id===id)||(app.workspace&&app.workspace.events||[]).find(x=>x.id===id)||systemCheckinEvents(app.monthKey).find(x=>x.id===id);if(!e)return;openModal(`<div class="modal-head"><div><h2>${esc(e.title)}</h2><div class="sub">${fmtDate(e.startDate)}${e.endDate&&e.endDate!==e.startDate?' – '+fmtDate(e.endDate):''}</div></div><button class="close" onclick="closeModal()">×</button></div><p>${esc(e.notes||'')}</p><div class="notice">${esc(e.memberName||'ISL member')}${e.location?' · '+esc(e.location):''}</div>`)}
function renderEventList(events,editable){return events.map(e=>{const d=new Date(String(e.startDate).slice(0,10)+'T12:00:00');return `<div class="event-item"><div class="event-date"><strong>${d.getDate()}</strong><span>${d.toLocaleDateString('en-IE',{month:'short'})}</span></div><div class="event-info"><div class="event-title">${esc(e.title)}</div><div class="event-meta">${esc(e.memberName||'You')}${e.startTime?' · '+esc(e.startTime):''}${e.location?' · '+esc(e.location):''}</div>${e.notes?`<div class="event-meta">${esc(e.notes)}</div>`:''}</div>${editable&&!e.system?`<div class="event-actions"><button class="btn ghost small" onclick="openEventModal('${e.id}')">Edit</button></div>`:''}</div>`}).join('')}

function renderLogin(){const members=app.dashboard&&app.dashboard.members||[];document.getElementById('loginView').innerHTML=`<div class="login-wrap"><div class="card login-card"><div class="login-icon">ISL</div><div class="eyebrow">Secure member access</div><h1 style="font-size:25px">Sign in to your workspace</h1><p class="sub">Choose your role and enter your PIN. Each member can only access their own workspace; administrators can access all workspaces and the Admin area.</p><form onsubmit="event.preventDefault();login()"><div class="field"><label>Role / workspace</label><select id="loginRole">${roleKeys.map(([k,label])=>{const m=members.find(x=>x.roleKey===k);return `<option value="${k}">${esc(m?m.name:label)} — ${esc(m?m.roleTitle:label)}</option>`}).join('')}</select></div><div class="field"><label>PIN</label><input id="loginPin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="12" placeholder="Enter your PIN" required></div><button class="btn primary" style="width:100%;margin-top:8px">Sign in securely</button></form><div class="notice" style="margin-top:16px">Use the temporary PIN provided by your administrator. Change it immediately after your first sign-in in Password settings.</div></div></div>`}
async function login(){const role=document.getElementById('loginRole').value,pin=document.getElementById('loginPin').value;try{const r=await api('apiLogin',role,pin);app.token=r.token;storageSet('isl_token',r.token);app.member=r.member;app.isAdmin=r.isAdmin;app.viewRoleKey=r.member.roleKey;setNav();toast('Signed in successfully.');await loadWorkspace();showView('workspace');}catch(e){toast(e.message)}}
async function logout(){try{await api('apiLogout',app.token)}catch(e){}storageRemove('isl_token');app.token='';app.member=null;app.isAdmin=false;app.workspace=null;app.adminData=null;app.viewRoleKey=null;setNav();showView('dashboard');toast('You have signed out.');}

async function loadWorkspace(targetRoleKey){if(!app.token){showView('login');return}try{app.viewRoleKey=targetRoleKey||app.member.roleKey;app.workspace=await api('apiGetWorkspace',app.token,app.viewRoleKey);renderWorkspace()}catch(e){toast(e.message);if(e.message.includes('session'))logout()}}
function renderWorkspace(){const w=app.workspace;if(!w)return;const m=w.member;const title=(m.roleTitle==='Assistant Principal 2'?'Assistant Principal 2':m.roleTitle)+' · '+(m.initials||'Initials');let html=`<div class="page-head"><div><div class="eyebrow">${w.viewingOwn?'Personal leadership workspace':'Administrator view'}</div><h1>${esc(title)}</h1><p class="sub">${esc(m.name)} · Manage assigned responsibilities, record evidence of actions, organise upcoming work and complete termly self-reflection.</p></div><div class="pill-row">${w.isAdmin?`<span class="badge gold">Administrator</span>`:''}${w.viewingOwn?`<button class="btn ghost" onclick="openPasswordModal()">Password settings</button>`:''}</div></div>`;
  if(w.isAdmin){const members=app.adminData?app.adminData.members:[];html+=`<div class="card soft" style="margin-bottom:16px"><div class="form-grid"><div class="field" style="margin:0"><label>Administrator: view a member workspace</label><select id="adminViewMember" onchange="loadWorkspace(this.value)">${(members.length?members:roleKeys.map(r=>({roleKey:r[0],name:r[1]}))).map(x=>`<option value="${x.roleKey}" ${x.roleKey===app.viewRoleKey?'selected':''}>${esc(x.name)} — ${esc(x.roleKey)}</option>`).join('')}</select></div><div style="display:flex;align-items:end;justify-content:flex-end"><button class="btn secondary" onclick="showView('admin')">Open administration</button></div></div></div>`}
  html+=`<div class="card soft" style="margin:0 0 17px"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px"><strong>Assigned responsibilities</strong><span class="badge">${w.duties.filter(d=>d.active).length} active</span></div><div class="pill-row">${w.duties.filter(d=>d.active).map(d=>`<span class="badge gray">${esc(d.title)}</span>`).join('')||'<span class="subtle">No duties have been assigned yet.</span>'}</div></div><div class="tabs" id="workspaceTabs">${[['overview','Overview'],['duties','Duties & LAOS standards'],['actions','Action log'],['calendar','Calendar'],['lists','To-do & upcoming'],['checkins','Termly check-ins'],['history','History']].map(([k,l])=>`<button class="tab ${app.wsTab===k?'active':''}" onclick="setWorkspaceTab('${k}')">${l}</button>`).join('')}</div><div id="workspaceContent"></div>`;
  document.getElementById('workspaceView').innerHTML=html;renderWorkspaceTab();}
function setWorkspaceTab(k){app.wsTab=k;document.querySelectorAll('#workspaceTabs .tab').forEach(b=>b.classList.toggle('active',b.textContent.includes(({overview:'Overview',duties:'Duties',actions:'Action log',calendar:'Calendar',lists:'To-do',checkins:'Termly',history:'History'})[k])));renderWorkspaceTab()}
function renderWorkspaceTab(){const w=app.workspace,m=w.member,role=app.viewRoleKey;const box=document.getElementById('workspaceContent');if(!box)return;
 if(app.wsTab==='overview'){const activeTasks=w.tasks.filter(t=>!t.completed&&t.itemType==='task');const upcoming=w.tasks.filter(t=>!t.completed&&t.itemType==='upcoming');const openDuties=w.duties.filter(d=>d.active);box.innerHTML=`<div class="grid stats"><div class="card"><div class="stat-label">Assigned duties</div><div class="stat-value">${openDuties.length}</div><div class="stat-note">Active responsibilities</div></div><div class="card"><div class="stat-label">Actions recorded</div><div class="stat-value">${w.actions.length}</div><div class="stat-note">Your evidence log</div></div><div class="card"><div class="stat-label">Open tasks</div><div class="stat-value">${activeTasks.length}</div><div class="stat-note">Items awaiting completion</div></div><div class="card"><div class="stat-label">Upcoming dates</div><div class="stat-value">${upcoming.length}</div><div class="stat-note">On your ISL calendar</div></div></div>
  <div class="section-title"><h2>Assigned duties</h2><button class="link-btn" onclick="setWorkspaceTab('duties')">View duties →</button></div><div class="grid two">${openDuties.slice(0,4).map(d=>`<div class="card"><div class="duty-title">${esc(d.title)}</div><div class="duty-meta">${esc(d.description||'No additional description')}</div><div class="duty-tags">${d.standardIds.map(id=>`<span class="badge gray">${esc(id)}</span>`).join('')}</div></div>`).join('')||'<div class="card empty"><strong>No duties assigned yet</strong>Your administrator will add responsibilities here.</div>'}</div>
  <div class="grid two" style="margin-top:18px"><div class="card"><div class="section-title" style="margin:0 0 10px"><h2>To-do list</h2><button class="btn secondary small" onclick="openTaskModal('task')">+ Add task</button></div>${renderTaskList(activeTasks.slice(0,5),true)}</div><div class="card"><div class="section-title" style="margin:0 0 10px"><h2>Upcoming events &amp; reminders</h2><button class="btn secondary small" onclick="openTaskModal('upcoming')">+ Add item</button></div>${renderTaskList(w.tasks.filter(t=>!t.completed&&t.itemType==='upcoming').slice(0,5),true,false,'upcoming')}<div class="cal-under">Dated calendar entries are managed in your Calendar tab.</div></div></div>`;}
 else if(app.wsTab==='duties'){box.innerHTML=`<div class="section-title"><div><h2>Your assigned responsibilities</h2><p class="sub">Each duty is connected to one or more LAOS standards. Your action log can be linked to a duty as well as a standard.</p></div></div><div class="grid two">${w.duties.map(d=>`<div class="card"><div style="display:flex;justify-content:space-between;gap:10px"><div class="duty-title">${esc(d.title)}</div><span class="badge ${d.active?'':'gray'}">${d.active?'Active':'Archived'}</span></div><p class="sub" style="font-size:12px;margin:6px 0">${esc(d.description||'')}</p><div class="duty-meta">${d.reviewDate?'Review: '+fmtDate(d.reviewDate):'No review date'} ${d.frequency?'· '+esc(d.frequency):''}</div><div class="duty-tags">${d.standardIds.map(id=>{const s=findStd(id);return `<span class="badge gray">${esc(id)} · ${esc(s?s.title:'')}</span>`}).join('')}</div></div>`).join('')||'<div class="card empty"><strong>No duties allocated</strong>Ask an administrator to add duties and link them to LAOS standards.</div>'}</div>
  <div class="section-title"><h2>Domains and standards</h2><span class="badge">Leadership and Management</span></div><p class="sub" style="margin-bottom:12px">Expand a domain, then select a standard to view the official effective and highly effective practice statements and the actions recorded against it.</p>${w.standards.map((d,di)=>domainHTML(d,di,w.actions)).join('')}`;}
 else if(app.wsTab==='actions'){box.innerHTML=`<div class="section-title"><div><h2>Action log</h2><p class="sub">Record what you have done, the impact, supporting evidence and next steps. Every entry must be categorised under a domain and standard.</p></div><button class="btn primary" onclick="openActionModal()">+ Record an action</button></div><div class="card">${renderActionEntries(w.actions,true)}</div>`;}
 else if(app.wsTab==='calendar'){box.innerHTML=`<div class="card"><div class="calendar-top"><div><div class="eyebrow">Your calendar</div><div class="month-label">${monthName(app.monthKey)}</div></div><div class="pill-row"><button class="btn ghost small" onclick="changePersonalMonth(-1)">←</button><button class="btn ghost small" onclick="app.monthKey=localMonth();renderWorkspaceTab()">Today</button><button class="btn ghost small" onclick="changePersonalMonth(1)">→</button><button class="btn primary small" onclick="openEventModal()">+ Add date</button></div></div><div id="personalCalendar"></div><div class="cal-under">Dates entered here are automatically shared on the ISL dashboard calendar.</div></div><div class="section-title"><h2>Your calendar events</h2></div><div class="card">${renderEventTasks(w.events.filter(e=>!e.completed).sort((a,b)=>a.startDate.localeCompare(b.startDate)),true)}</div>`;renderCalendar('personalCalendar',app.monthKey,w.events.concat(systemCheckinEvents(app.monthKey)),true);}
 else if(app.wsTab==='lists'){const tasks=w.tasks.filter(t=>!t.completed&&t.itemType==='task'),upcoming=w.tasks.filter(t=>!t.completed&&t.itemType==='upcoming');box.innerHTML=`<div class="grid two"><div class="card"><div class="section-title" style="margin:0 0 12px"><h2>To-do list</h2><button class="btn primary small" onclick="openTaskModal('task')">+ Add task</button></div>${renderTaskList(tasks,true)}</div><div class="card"><div class="section-title" style="margin:0 0 12px"><h2>Upcoming events &amp; reminders</h2><button class="btn primary small" onclick="openTaskModal('upcoming')">+ Add item</button></div>${renderTaskList(upcoming,true,false,'upcoming')}</div></div>`;}
 else if(app.wsTab==='checkins'){box.innerHTML=renderCheckins(w);}
 else if(app.wsTab==='history'){const completedTasks=w.tasks.filter(t=>t.completed).sort((a,b)=>String(b.completedAt).localeCompare(String(a.completedAt)));const completedEvents=w.events.filter(e=>e.completed).sort((a,b)=>String(b.completedAt).localeCompare(String(a.completedAt)));box.innerHTML=`<div class="section-title"><div><h2>Completed task and event history</h2><p class="sub">Ticked-off items are kept here rather than being permanently deleted.</p></div></div><div class="grid two"><div class="card"><h3>Completed tasks</h3>${renderTaskList(completedTasks,false,true)}</div><div class="card"><h3>Completed events</h3>${renderEventTasks(completedEvents,false,true)}</div></div><div class="section-title"><h2>Past action-log entries</h2></div><div class="card">${renderActionEntries(w.actions,false)}</div>`;}
}
function findStd(id){for(const d of (app.workspace&&app.workspace.standards)||[]){const s=d.standards.find(x=>x.id===id);if(s)return s}return null}
function domainHTML(d,idx,actions){const open=app.expandedDomain===d.id;const count=d.standards.reduce((n,s)=>n+actions.filter(a=>a.standardId===s.id).length,0);return `<div class="domain-card"><div class="domain-head" onclick="app.expandedDomain=app.expandedDomain==='${d.id}'?'':'${d.id}';renderWorkspaceTab()"><div><div class="domain-name">Domain ${idx+1}: ${esc(d.title)}</div><div class="domain-desc">${d.standards.length} standards · ${count} logged actions</div></div><span class="badge">${count} actions</span></div>${open?`<div class="standard-list">${d.standards.map((s,si)=>{const n=actions.filter(a=>a.standardId===s.id).length;const expanded=app.expandedStandard===s.id;return `<div class="standard"><div class="standard-head" onclick="app.expandedStandard=app.expandedStandard==='${s.id}'?'':'${s.id}';renderWorkspaceTab()"><div class="standard-num">${si+1}</div><div class="standard-title"><span class="subtle">${esc(s.id)}</span> · ${esc(s.title)}</div><div class="standard-count">${n} actions</div></div>${expanded?`<div class="standard-detail"><div class="practice-grid"><div class="practice"><h4>Effective practice</h4><ul>${s.effective.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div><div class="practice"><h4>Highly effective practice</h4><ul>${s.highly.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div></div><div class="section-title" style="margin:14px 0 6px"><h3>Actions recorded</h3><button class="btn secondary small" onclick="openActionModal('${d.id}','${s.id}')">+ Log action</button></div>${renderActionEntries(actions.filter(a=>a.standardId===s.id),false)}</div>`:''}</div>`}).join('')}</div>`:''}</div>`}
function renderActionEntries(items,allowEdit){if(!items.length)return '<div class="empty"><strong>No actions recorded yet</strong>Record actions as you work through your assigned responsibilities.</div>';return items.map(a=>`<div class="log-entry"><div class="log-entry-title">${esc(a.actionTaken)}</div><div class="log-meta">${fmtDate(a.date)} · ${esc(a.domainId)} / ${esc(a.standardId)} ${a.dutyId?'· linked to a duty':''}</div>${a.impact?`<div class="log-body"><strong>Impact / outcome:</strong> ${esc(a.impact)}</div>`:''}${a.evidenceUrl?`<div class="log-meta">Evidence: <a href="${esc(a.evidenceUrl)}" target="_blank" rel="noopener">Open evidence link ↗</a></div>`:''}${a.nextSteps?`<div class="log-body"><strong>Next steps:</strong> ${esc(a.nextSteps)}</div>`:''}${allowEdit?`<div class="pill-row" style="margin-top:7px"><button class="link-btn" onclick="openActionModal('${a.domainId}','${a.standardId}','${a.id}')">Edit</button><button class="link-btn" style="color:var(--red)" onclick="deleteAction('${a.id}')">Delete</button></div>`:''}</div>`).join('')}
function renderTaskList(items,editable,history,itemType='task'){ if(!items.length)return '<div class="empty"><strong>'+ (history?'No completed tasks':'Nothing on your to-do list') +'</strong>'+(history?'Completed tasks will appear here.':'Add a task when something needs your attention.')+'</div>';return items.map(t=>`<div class="list-item"><input type="checkbox" ${t.completed?'checked':''} ${editable?'':'disabled'} onchange="toggleTask('${t.id}',this.checked)"><div class="list-content"><div class="list-title ${t.completed?'done':''}">${esc(t.title)}</div><div class="list-detail">${t.dueDate?'Due '+fmtDate(t.dueDate):'No due date'}${t.notes?' · '+esc(t.notes):''}${t.completedAt?' · Completed '+fmtDate(t.completedAt):''}</div></div>${editable?`<button class="link-btn" onclick="openTaskModal('${itemType}','${t.id}')">Edit</button>`:''}</div>`).join('')}
function renderEventTasks(items,editable,history){if(!items.length)return '<div class="empty"><strong>'+ (history?'No completed events':'No upcoming events') +'</strong>'+(history?'Completed events will appear here.':'Add an ISL-related date to your calendar.')+'</div>';return items.map(e=>`<div class="list-item"><input type="checkbox" ${e.completed?'checked':''} ${editable?'':'disabled'} onchange="toggleEvent('${e.id}',this.checked)"><div class="list-content"><div class="list-title ${e.completed?'done':''}">${esc(e.title)}</div><div class="list-detail">${fmtDate(e.startDate)}${e.endDate&&e.endDate!==e.startDate?' – '+fmtDate(e.endDate):''}${e.startTime?' · '+esc(e.startTime):''}${e.location?' · '+esc(e.location):''}${e.completedAt?' · Completed '+fmtDate(e.completedAt):''}</div></div>${editable?`<button class="link-btn" onclick="openEventModal('${e.id}')">Edit</button>`:''}</div>`).join('')}
function renderCheckins(w){const year=w.currentSchoolYear;const member=w.member;return `<div class="section-title"><div><h2>Termly self-reflection</h2><p class="sub">For each term, tick the standards you feel you currently carry out in your role. You can save a draft and return before submitting.</p></div><span class="badge">${esc(year)}</span></div><div class="grid three">${['Term 1','Term 2','Term 3'].map(term=>{const c=w.checkins.find(x=>x.term===term&&x.schoolYear===year);return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h3>${term}</h3><span class="badge ${c&&c.status==='submitted'?'':'gold'}">${c?c.status:'Not started'}</span></div><div class="stat-value" style="font-size:20px">${c?c.selectedStandards.length:0} <span class="subtle" style="font-size:12px;font-weight:500">standards selected</span></div><div class="stat-note">${term==='Term 1'?'December':term==='Term 2'?'March':'June'} check-in window</div><button class="btn ${c&&c.status==='submitted'?'ghost':'primary'} small" style="width:100%;margin-top:14px" onclick="openCheckin('${term}')">${c&&c.status==='submitted'?'View submitted check-in':'Complete check-in'}</button></div>`}).join('')}</div><div class="notice" style="margin-top:16px">Once all five ISL members have submitted a termly check-in, the combined team report and five individual reports will be published on the shared dashboard. Submitted check-ins are locked; an administrator can reopen one if necessary.</div>`}
function systemCheckinEvents(monthKey){const [y,m]=monthKey.split('-').map(Number);if(![12,3,6].includes(m))return [];const start=`${y}-${String(m).padStart(2,'0')}-01`;const last=new Date(y,m,0).getDate();const end=`${y}-${String(m).padStart(2,'0')}-${String(last).padStart(2,'0')}`;const term=m===12?'Term 1':(m===3?'Term 2':'Term 3');return [{id:'SYS_'+term+'_'+y,memberKey:'SYSTEM',memberName:'All ISL members',title:term+' check-in window',startDate:start,endDate:end,allDay:true,system:true,notes:'Complete your '+term+' self-reflection during this month.'}]}
function changePersonalMonth(n){let [y,m]=app.monthKey.split('-').map(Number);const d=new Date(y,m-1+n,1);app.monthKey=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');renderWorkspaceTab()}

// ---- Modals and actions ----
function openModal(content){document.getElementById('modalContent').innerHTML=content;document.getElementById('modalBackdrop').classList.add('show')}
function closeModal(){document.getElementById('modalBackdrop').classList.remove('show')}
function openEventModal(id,date){const e=id?app.workspace.events.find(x=>x.id===id):null;const start=e?e.startDate:(date||todayKey());openModal(`<div class="modal-head"><div><div class="eyebrow">Shared calendar</div><h2>${e?'Edit calendar event':'Add calendar event'}</h2></div><button class="close" onclick="closeModal()">×</button></div><form onsubmit="event.preventDefault();saveEvent('${e?e.id:''}')"><div class="form-grid"><div class="field wide"><label>Event title <span class="required">*</span></label><input id="evTitle" required maxlength="180" value="${esc(e?e.title:'')}"></div><div class="field"><label>Start date <span class="required">*</span></label><input type="date" id="evStart" required value="${start}"></div><div class="field"><label>End date</label><input type="date" id="evEnd" value="${esc(e?e.endDate:start)}"></div><div class="field"><label>Start time</label><input type="time" id="evStartTime" value="${esc(e?e.startTime:'')}"></div><div class="field"><label>End time</label><input type="time" id="evEndTime" value="${esc(e?e.endTime:'')}"></div><div class="field"><label>Location</label><input id="evLocation" value="${esc(e?e.location:'')}" maxlength="300"></div><div class="field"><label><input type="checkbox" id="evAllDay" style="width:auto;margin-right:6px" ${e&&e.allDay?'checked':''}> All-day event</label></div><div class="field wide"><label>Notes</label><textarea id="evNotes">${esc(e?e.notes:'')}</textarea></div></div><div class="pill-row" style="justify-content:flex-end"><button type="button" class="btn ghost" onclick="closeModal()">Cancel</button>${e?`<button type="button" class="btn danger" onclick="deleteEvent('${e.id}')">Delete</button>`:''}<button class="btn primary">Save event</button></div></form>`)}
async function saveEvent(id){try{await api('apiSaveEvent',app.token,{id:id||undefined,title:document.getElementById('evTitle').value,startDate:document.getElementById('evStart').value,endDate:document.getElementById('evEnd').value,startTime:document.getElementById('evStartTime').value,endTime:document.getElementById('evEndTime').value,allDay:document.getElementById('evAllDay').checked,location:document.getElementById('evLocation').value,notes:document.getElementById('evNotes').value},app.viewRoleKey);closeModal();toast('Calendar event saved and shared.');await refreshWorkspaceAndDashboard()}catch(e){toast(e.message)}}
async function deleteEvent(id){if(!confirm('Delete this calendar event?'))return;try{await api('apiDeleteEvent',app.token,id);closeModal();toast('Event deleted.');await refreshWorkspaceAndDashboard()}catch(e){toast(e.message)}}
async function toggleEvent(id,done){try{await api('apiToggleEvent',app.token,id,done);toast(done?'Event moved to history.':'Event returned to upcoming.');await refreshWorkspaceAndDashboard()}catch(e){toast(e.message)}}
function openTaskModal(type,id){const t=id?app.workspace.tasks.find(x=>x.id===id):null;openModal(`<div class="modal-head"><div><div class="eyebrow">Personal task manager</div><h2>${t?'Edit task':'Add a to-do item'}</h2></div><button class="close" onclick="closeModal()">×</button></div><form onsubmit="event.preventDefault();saveTask('${t?t.id:''}','${type}')"><div class="field"><label>Task <span class="required">*</span></label><input id="taskTitle" required maxlength="220" value="${esc(t?t.title:'')}"></div><div class="field"><label>Due date (optional)</label><input type="date" id="taskDate" value="${esc(t?t.dueDate:'')}"></div><div class="field"><label>Notes</label><textarea id="taskNotes">${esc(t?t.notes:'')}</textarea></div><div class="pill-row" style="justify-content:flex-end"><button type="button" class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary">Save task</button></div></form>`)}
async function saveTask(id,type){try{await api('apiSaveTask',app.token,{id:id||undefined,itemType:type,title:document.getElementById('taskTitle').value,dueDate:document.getElementById('taskDate').value,notes:document.getElementById('taskNotes').value},app.viewRoleKey);closeModal();toast('Task saved.');await refreshWorkspace()}catch(e){toast(e.message)}}
async function toggleTask(id,done){try{await api('apiToggleTask',app.token,id,done);toast(done?'Task completed and moved to history.':'Task returned to your list.');await refreshWorkspace()}catch(e){toast(e.message)}}
function openActionModal(domainId,standardId,id){const a=id?app.workspace.actions.find(x=>x.id===id):null;const selectedDomain=a?a.domainId:(domainId||'D1');const selectedStandard=a?a.standardId:(standardId||'');const std=app.workspace.standards.find(d=>d.id===selectedDomain);const dutyOptions=app.workspace.duties.filter(d=>d.active);openModal(`<div class="modal-head"><div><div class="eyebrow">Evidence of leadership practice</div><h2>${a?'Edit action':'Record an action'}</h2></div><button class="close" onclick="closeModal()">×</button></div><form onsubmit="event.preventDefault();saveAction('${a?a.id:''}')"><div class="form-grid"><div class="field"><label>Date <span class="required">*</span></label><input type="date" id="actDate" required value="${esc(a?a.date:todayKey())}"></div><div class="field"><label>Associated duty (optional)</label><select id="actDuty"><option value="">Not linked to a specific duty</option>${dutyOptions.map(d=>`<option value="${d.id}" ${a&&a.dutyId===d.id?'selected':''}>${esc(d.title)}</option>`).join('')}</select></div><div class="field wide"><label>Domain <span class="required">*</span></label><select id="actDomain" onchange="updateActionStandards()">${app.workspace.standards.map(d=>`<option value="${d.id}" ${d.id===selectedDomain?'selected':''}>${esc(d.title)}</option>`).join('')}</select></div><div class="field wide"><label>Standard <span class="required">*</span></label><select id="actStandard">${(std?std.standards:[]).map(s=>`<option value="${s.id}" ${s.id===selectedStandard?'selected':''}>${esc(s.id)} — ${esc(s.title)}</option>`).join('')}</select></div><div class="field wide"><label>Action taken <span class="required">*</span></label><textarea id="actTaken" required placeholder="Describe what you did…">${esc(a?a.actionTaken:'')}</textarea></div><div class="field wide"><label>Impact / outcome</label><textarea id="actImpact" placeholder="What difference did this make? What was achieved?">${esc(a?a.impact:'')}</textarea></div><div class="field wide"><label>Evidence link</label><input id="actEvidence" type="url" placeholder="https://…" value="${esc(a?a.evidenceUrl:'')}"><div class="hint">Paste a link to a relevant document or resource. Do not include sensitive pupil information.</div></div><div class="field wide"><label>Next steps</label><textarea id="actNext" placeholder="Any follow-up, review or further action needed?">${esc(a?a.nextSteps:'')}</textarea></div></div><div class="pill-row" style="justify-content:flex-end"><button type="button" class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary">Save action</button></div></form>`)}
function updateActionStandards(){var domainSelect=document.getElementById('actDomain');var standardSelect=document.getElementById('actStandard');if(!domainSelect||!standardSelect||!app.workspace)return;var domain=app.workspace.standards.find(function(item){return item.id===domainSelect.value;});if(!domain){standardSelect.innerHTML='';return;}var options=[];domain.standards.forEach(function(standard){var option=document.createElement('option');option.value=standard.id;option.textContent=standard.id+' — '+standard.title;options.push(option);});standardSelect.replaceChildren.apply(standardSelect,options);}
async function saveAction(id){try{await api('apiSaveAction',app.token,{id:id||undefined,date:document.getElementById('actDate').value,dutyId:document.getElementById('actDuty').value,domainId:document.getElementById('actDomain').value,standardId:document.getElementById('actStandard').value,actionTaken:document.getElementById('actTaken').value,impact:document.getElementById('actImpact').value,evidenceUrl:document.getElementById('actEvidence').value,nextSteps:document.getElementById('actNext').value},app.viewRoleKey);closeModal();toast('Action recorded. Dashboard totals updated.');await refreshWorkspaceAndDashboard()}catch(e){toast(e.message)}}
async function deleteAction(id){if(!confirm('Delete this action-log entry?'))return;try{await api('apiDeleteAction',app.token,id);toast('Action deleted.');await refreshWorkspaceAndDashboard()}catch(e){toast(e.message)}}
function openPasswordModal(){openModal(`<div class="modal-head"><div><div class="eyebrow">Account security</div><h2>Change your PIN</h2></div><button class="close" onclick="closeModal()">×</button></div><form onsubmit="event.preventDefault();changePin()"><div class="field"><label>Current PIN</label><input id="oldPin" type="password" inputmode="numeric" required></div><div class="field"><label>New PIN (4–12 digits)</label><input id="newPin" type="password" inputmode="numeric" minlength="4" maxlength="12" pattern="[0-9]{4,12}" required></div><div class="field"><label>Confirm new PIN</label><input id="confirmPin" type="password" inputmode="numeric" minlength="4" maxlength="12" pattern="[0-9]{4,12}" required></div><div class="pill-row" style="justify-content:flex-end"><button type="button" class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary">Update PIN</button></div></form>`)}
async function changePin(){const p=document.getElementById('newPin').value;if(p!==document.getElementById('confirmPin').value){toast('The new PINs do not match.');return}try{await api('apiChangeOwnPin',app.token,document.getElementById('oldPin').value,p);closeModal();toast('Your PIN has been changed.')}catch(e){toast(e.message)}}
async function refreshWorkspace(){await loadWorkspace(app.viewRoleKey)}
async function refreshWorkspaceAndDashboard(){await loadWorkspace(app.viewRoleKey);await loadDashboard();if(document.getElementById('workspaceView').style.display!=='none')showView('workspace')}

function openCheckin(term){const year=app.workspace.currentSchoolYear;const c=app.workspace.checkins.find(x=>x.term===term&&x.schoolYear===year);const locked=c&&c.status==='submitted';const selected=c?c.selectedStandards:[];openModal(`<div class="modal-head"><div><div class="eyebrow">${term} · ${esc(year)}</div><h2>${locked?'Submitted self-check-in':'Which standards do you currently carry out?'}</h2><p class="sub">Select every standard you feel is currently part of your role. This is reflective self-reporting, not a performance score.</p></div><button class="close" onclick="closeModal()">×</button></div><div id="checkinChoices">${app.workspace.standards.map((d,i)=>`<div class="checkin-domain"><h4>Domain ${i+1}: ${esc(d.title)}</h4>${d.standards.map((s,j)=>`<label class="checkin-standard"><input type="checkbox" value="${s.id}" ${selected.includes(s.id)?'checked':''} ${locked?'disabled':''}><span><strong>${i+1}.${j+1}</strong> · ${esc(s.title)}</span></label>`).join('')}</div>`).join('')}</div><div class="pill-row" style="justify-content:space-between;margin-top:15px">${locked?`<span class="badge">Submitted ${fmtDate(c.submittedAt)}</span>`:`<span class="subtle" style="font-size:11px">You can save a draft before submitting.</span>`}<div class="pill-row">${locked?'':`<button class="btn ghost" onclick="saveCheckin('${term}','draft')">Save draft</button><button class="btn primary" onclick="submitCheckin('${term}')">Submit check-in</button>`}<button class="btn ghost" onclick="closeModal()">Close</button></div></div>`)}
function getCheckinIds(){return Array.from(document.querySelectorAll('#checkinChoices input[type=checkbox]:checked')).map(x=>x.value)}
async function saveCheckin(term,status){try{await api('apiSaveCheckin',app.token,{term,schoolYear:app.workspace.currentSchoolYear,selectedStandards:getCheckinIds(),status},app.viewRoleKey);closeModal();toast(status==='submitted'?'Check-in submitted.':'Draft saved.');await refreshWorkspaceAndDashboard()}catch(e){toast(e.message)}}
function submitCheckin(term){if(!confirm('Submit this check-in? You will not be able to edit it unless an administrator reopens it.'))return;saveCheckin(term,'submitted')}

// ---- Administration ----
async function loadAdmin(){try{app.adminData=await api('apiGetAdminData',app.token);renderAdmin()}catch(e){toast(e.message);showView('dashboard')}}
function renderAdmin(){const a=app.adminData;if(!a)return;document.getElementById('adminView').innerHTML=`<div class="page-head"><div><div class="eyebrow">Restricted access</div><h1>ISL Administration</h1><p class="sub">Manage the five role accounts, allocate duties, reset PINs and reopen submitted check-ins.</p></div><span class="badge gold">Administrator</span></div><div class="tabs"><button class="tab active" onclick="adminTab('members')">Members &amp; access</button><button class="tab" onclick="adminTab('duties')">Duties register</button><button class="tab" onclick="adminTab('checkins')">Check-ins</button></div><div id="adminContent"></div>`;adminTab('members')}
function adminTab(k){document.querySelectorAll('#adminView .tabs .tab').forEach((b,i)=>b.classList.toggle('active',['members','duties','checkins'][i]===k));const el=document.getElementById('adminContent');if(k==='members'){el.innerHTML=`<div class="card"><div class="section-title" style="margin:0 0 10px"><div><h2>ISL member accounts</h2><p class="sub">Enter each holder’s name and initials. The workspace heading will update automatically.</p></div></div>${app.adminData.members.map(m=>`<div class="member-admin"><div><div class="member-name">${esc(m.roleTitle)} ${m.slotLabel?'· '+esc(m.slotLabel):''}</div><div class="member-role">Account: ${esc(m.roleKey)} · ${m.active?'Active':'Inactive'}</div></div><div class="pill-row member-admin-actions"><button class="btn ghost small" onclick="editMember('${m.roleKey}')">Edit profile</button><button class="btn ghost small" onclick="resetMemberPin('${m.roleKey}')">Reset PIN</button><button class="btn secondary small" onclick="loadWorkspace('${m.roleKey}');showView('workspace')">Open workspace</button></div><div>${m.isAdmin?'<span class="badge gold">Admin</span>':'<span class="badge gray">Member</span>'}</div></div>`).join('')}</div><div class="notice warning" style="margin-top:14px">Initial admin accounts are Principal and AP2 1. Change the name/initials for the AP2 workspace held by the AP2 administrator, or transfer administrator access to the correct AP2 account here. Keep the Principal account as an administrator.</div>`}
 else if(k==='duties'){el.innerHTML=`<div class="grid two"><div class="card"><h2>Add / edit a responsibility</h2><p class="sub" style="font-size:12px">Every duty must be allocated to a member and linked to at least one LAOS standard.</p><div class="field"><label>Assigned member</label><select id="dutyMember">${app.adminData.members.filter(m=>m.active).map(m=>`<option value="${m.roleKey}">${esc(m.name)} — ${esc(m.roleTitle)}</option>`).join('')}</select></div><div class="field"><label>Duty title</label><input id="dutyTitle" maxlength="180" placeholder="e.g. Coordinate digital learning"></div><div class="field"><label>Description / scope</label><textarea id="dutyDescription"></textarea></div><div class="form-grid"><div class="field"><label>Review date (optional)</label><input type="date" id="dutyReview"></div><div class="field"><label>Review frequency</label><select id="dutyFrequency"><option value="">Not specified</option><option>Termly</option><option>Half-termly</option><option>Annually</option><option>Ongoing</option></select></div></div><div class="field"><label>Linked standards <span class="required">*</span></label><div id="dutyStandardChecks">${standardsCheckboxes()}</div></div><button class="btn primary" onclick="saveDuty()">Save responsibility</button></div><div class="card"><h2>Current responsibilities</h2><div class="field"><label>Filter by member</label><select id="dutyFilter" onchange="renderDutyList()"><option value="all">All members</option>${app.adminData.members.map(m=>`<option value="${m.roleKey}">${esc(m.name)}</option>`).join('')}</select></div><div id="dutyList"></div></div></div>`;renderDutyList()}
 else if(k==='checkins'){el.innerHTML=`<div class="card"><h2>Submitted check-ins</h2><p class="sub" style="font-size:12px">Administrators can reopen a submitted check-in if the member needs to make a correction.</p>${app.adminData.checkins.length?app.adminData.checkins.sort((a,b)=>String(b.updatedAt).localeCompare(String(a.updatedAt))).map(c=>{const m=app.adminData.members.find(x=>x.roleKey===c.memberKey);return `<div class="duty-row"><div style="display:flex;justify-content:space-between;gap:8px"><div><div class="duty-title">${esc(m?m.name:c.memberKey)} · ${esc(c.term)} · ${esc(c.schoolYear)}</div><div class="duty-meta">${c.status==='submitted'?'Submitted '+fmtDate(c.submittedAt):'Draft'} · ${c.selectedStandards.length} standards selected</div></div>${c.status==='submitted'?`<button class="btn ghost small" onclick="reopenCheckin('${c.id}')">Reopen</button>`:''}</div></div>`}).join(''):'<div class="empty"><strong>No check-ins submitted yet</strong>Check-in records will appear here as members complete them.</div>'}</div>`}}
function standardsCheckboxes(){return app.adminData.standards.map((d,i)=>`<div class="checkin-domain"><h4>Domain ${i+1}: ${esc(d.title)}</h4>${d.standards.map(s=>`<label class="check-row"><input type="checkbox" value="${s.id}"><span><strong>${s.id}</strong> · ${esc(s.title)}</span></label>`).join('')}</div>`).join('')}
function renderDutyList(){const el=document.getElementById('dutyList');if(!el)return;const f=document.getElementById('dutyFilter').value;const list=app.adminData.duties.filter(d=>f==='all'||d.memberKey===f);el.innerHTML=list.length?list.map(d=>{const m=app.adminData.members.find(x=>x.roleKey===d.memberKey);return `<div class="duty-row"><div class="duty-title">${esc(d.title)}</div><div class="duty-meta">${esc(m?m.name:d.memberKey)} · ${d.active?'Active':'Archived'}${d.reviewDate?' · Review '+fmtDate(d.reviewDate):''}</div><div class="duty-tags">${d.standardIds.map(id=>`<span class="badge gray">${id}</span>`).join('')}</div><div class="pill-row" style="margin-top:8px"><button class="link-btn" onclick="editDuty('${d.id}')">Edit</button><button class="link-btn" style="color:var(--red)" onclick="archiveDuty('${d.id}')">Archive</button></div></div>`}).join(''):'<div class="empty">No duties match this filter.</div>'}
function editMember(roleKey){const m=app.adminData.members.find(x=>x.roleKey===roleKey);openModal(`<div class="modal-head"><div><div class="eyebrow">Member account</div><h2>Edit profile</h2></div><button class="close" onclick="closeModal()">×</button></div><form onsubmit="event.preventDefault();saveMember('${roleKey}')"><div class="field"><label>Name</label><input id="memName" required maxlength="100" value="${esc(m.name)}"></div><div class="field"><label>Initials (shown in page heading)</label><input id="memInitials" required maxlength="12" value="${esc(m.initials)}"></div><label class="check-row"><input type="checkbox" id="memActive" ${m.active?'checked':''} ${roleKey==='PRINCIPAL'?'disabled':''}> Active account</label><label class="check-row"><input type="checkbox" id="memAdmin" ${m.isAdmin?'checked':''} ${roleKey==='PRINCIPAL'?'checked disabled':''}> Administrator access</label><div class="pill-row" style="justify-content:flex-end;margin-top:15px"><button type="button" class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary">Save profile</button></div></form>`)}
async function saveMember(roleKey){try{await api('apiAdminSaveMember',app.token,{roleKey,name:document.getElementById('memName').value,initials:document.getElementById('memInitials').value,active:document.getElementById('memActive').checked,isAdmin:document.getElementById('memAdmin').checked});closeModal();toast('Member profile updated.');await loadAdmin();await loadDashboard();}catch(e){toast(e.message)}}
function resetMemberPin(roleKey){const m=app.adminData.members.find(x=>x.roleKey===roleKey);openModal(`<div class="modal-head"><div><div class="eyebrow">Administrator control</div><h2>Reset PIN for ${esc(m.name)}</h2></div><button class="close" onclick="closeModal()">×</button></div><form onsubmit="event.preventDefault();saveMemberPin('${roleKey}')"><div class="field"><label>New PIN (4–12 digits)</label><input id="resetPin" type="password" pattern="[0-9]{4,12}" minlength="4" maxlength="12" required></div><div class="pill-row" style="justify-content:flex-end"><button type="button" class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary">Reset PIN</button></div></form>`)}
async function saveMemberPin(roleKey){try{await api('apiAdminResetPin',app.token,roleKey,document.getElementById('resetPin').value);closeModal();toast('PIN reset successfully.');}catch(e){toast(e.message)}}
async function saveDuty(){const standards=Array.from(document.querySelectorAll('#dutyStandardChecks input:checked')).map(x=>x.value);try{await api('apiAdminSaveDuty',app.token,{memberKey:document.getElementById('dutyMember').value,title:document.getElementById('dutyTitle').value,description:document.getElementById('dutyDescription').value,reviewDate:document.getElementById('dutyReview').value,frequency:document.getElementById('dutyFrequency').value,standardIds:standards});toast('Duty assigned.');await loadAdmin();await loadDashboard();}catch(e){toast(e.message)}}
function editDuty(id){const d=app.adminData.duties.find(x=>x.id===id);adminTab('duties');setTimeout(()=>{document.getElementById('dutyMember').value=d.memberKey;document.getElementById('dutyTitle').value=d.title;document.getElementById('dutyDescription').value=d.description||'';document.getElementById('dutyReview').value=d.reviewDate||'';document.getElementById('dutyFrequency').value=d.frequency||'';document.querySelectorAll('#dutyStandardChecks input').forEach(x=>x.checked=d.standardIds.includes(x.value));const btn=document.querySelector('#adminContent .btn.primary');btn.textContent='Save changes';btn.onclick=()=>saveDutyEdit(id);},50)}
async function saveDutyEdit(id){const standards=Array.from(document.querySelectorAll('#dutyStandardChecks input:checked')).map(x=>x.value);try{await api('apiAdminSaveDuty',app.token,{id,memberKey:document.getElementById('dutyMember').value,title:document.getElementById('dutyTitle').value,description:document.getElementById('dutyDescription').value,reviewDate:document.getElementById('dutyReview').value,frequency:document.getElementById('dutyFrequency').value,standardIds:standards});toast('Duty updated.');await loadAdmin();await loadDashboard();}catch(e){toast(e.message)}}
async function archiveDuty(id){if(!confirm('Archive this duty? It will no longer appear as an active responsibility.'))return;try{await api('apiAdminDeleteDuty',app.token,id);toast('Duty archived.');await loadAdmin();await loadDashboard()}catch(e){toast(e.message)}}
async function reopenCheckin(id){if(!confirm('Reopen this check-in? The member will be able to edit and resubmit it.'))return;try{await api('apiAdminReopenCheckin',app.token,id);toast('Check-in reopened.');await loadAdmin();await loadDashboard()}catch(e){toast(e.message)}}

// ---- Termly report output ----
async function checkReport(){const term=document.getElementById('reportTerm').value,year=document.getElementById('reportYear').value.trim();try{const r=await api('apiGetTermReport',term,year);const status=document.getElementById('reportStatus'),buttons=document.getElementById('reportButtons');if(!r.ready){status.innerHTML=`<span class="badge gold">Not ready</span> ${r.completed} of ${r.total} members have submitted ${term}.`;buttons.innerHTML='';document.getElementById('dashboardReport').innerHTML='';return}app.report=r;status.innerHTML=`<span class="badge">Complete</span> All five members have submitted ${term}.`;buttons.innerHTML=`<div class="pill-row" style="margin-top:12px"><button class="btn primary small" onclick="showReport('team')">Combined team report</button>${r.members.map(m=>`<button class="btn secondary small" onclick="showReport('${m.roleKey}')">${esc(m.name)} report</button>`).join('')}</div>`;}catch(e){toast(e.message)}}
function showReport(who){const r=app.report;if(!r||!r.ready)return;let html=`<div class="report-sheet"><div class="eyebrow">ISL Management Hub · Termly self-reflection</div><h1>${who==='team'?'Combined ISL Team Report':esc((r.members.find(m=>m.roleKey===who)||{}).name||'Individual Report')}</h1><p><strong>${esc(r.term)} · ${esc(r.schoolYear)}</strong></p><p>All five ISL members completed this check-in. This report records the standards each member identified as currently part of their role. It is a self-reflection record, not an evaluation or performance ranking.</p>`;
 if(who==='team'){html+=`<h2>Team overview</h2><table><thead><tr><th>Domain / standard</th><th>Members selecting this standard</th><th>Members</th></tr></thead><tbody>${r.domainSummary.map(d=>`<tr><th colspan="3">${esc(d.title)}</th></tr>${d.standards.map(s=>`<tr><td>${esc(s.id)} · ${esc(s.title)}</td><td>${s.count} / 5</td><td>${r.members.filter(m=>m.selectedStandards.includes(s.id)).map(m=>esc(m.initials||m.name)).join(', ')||'—'}</td></tr>`).join('')}`).join('')}</tbody></table><h2>Individual selections</h2>${r.members.map(m=>memberReportTable(m)).join('')}`;}
 else {const m=r.members.find(x=>x.roleKey===who);if(!m)return;html+=memberReportTable(m)}
 html+=`<p style="margin-top:26px;font-size:10px;color:#60746f">Source framework: Looking at Our School 2022: A Quality Framework for Primary Schools and Special Schools, Leadership and Management dimension.</p></div>`;document.getElementById('dashboardReport').innerHTML=`<div class="section-title"><h2>Printable report</h2><button class="btn primary" onclick="printReport()">Print / Save as PDF</button></div>${html}`;document.getElementById('dashboardReport').scrollIntoView({behavior:'smooth',block:'start'})}
function memberReportTable(m){return `<h2>${esc(m.name)} · ${esc(m.roleTitle)} ${m.slotLabel?'· '+esc(m.slotLabel):''}</h2><p style="font-size:11px;color:#526a64">Submitted: ${fmtDate(m.submittedAt)} · ${m.selectedStandards.length} standards selected</p>${LAOSForReport().map(d=>{const chosen=d.standards.filter(s=>m.selectedStandards.includes(s.id));return `<p style="font-size:12px;margin:10px 0 4px"><strong>${esc(d.title)}</strong></p>${chosen.length?`<ul style="font-size:11px;margin-top:4px">${chosen.map(s=>`<li>${esc(s.id)} · ${esc(s.title)}</li>`).join('')}</ul>`:'<p style="font-size:10px;color:#82918d">No standards selected in this domain.</p>'}`}).join('')}`}
function LAOSForReport(){return app.report&&app.report.standards?app.report.standards:[]}
function printReport(){const el=document.getElementById('dashboardReport');const pa=document.getElementById('printArea');pa.innerHTML=el.innerHTML;pa.style.display='block';window.print();pa.style.display='none';}

function showStartupError(title,message){var el=document.getElementById('dashboardView');if(el)el.innerHTML='<div class="notice warning"><strong>'+esc(title)+'</strong><p>'+esc(message)+'</p><p class="cal-under">Try refreshing the web app. If this message remains, send a screenshot to the app administrator.</p></div>'; }
window.addEventListener('error',function(e){showStartupError('The app encountered a browser error.',e.message||'Unknown browser error');});
window.addEventListener('unhandledrejection',function(e){showStartupError('The app could not finish loading.',e.reason&&e.reason.message||e.reason||'Unknown startup error');});
start().catch(function(e){showStartupError('The app could not start.',e&&e.message?e.message:String(e));});
</script>
</body>
</html>
